server {
    listen 3000;
    server_name _;
    root /app/dist;
    index index.html;

    # Same reasoning as the Vite dev proxy: the session cookie is
    # SameSite=Strict, so the API has to look like the same origin to the
    # browser. Point PHP_API at wherever the PHP app is actually served.
    location /api {
        proxy_pass ${PHP_API};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
